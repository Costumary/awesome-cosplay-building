<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="google-site-verification" content="opotl9JfaVwMumMfaSAHcjRmpWaEPEHuQ-0c5h0ryDM">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="robots" content="index, follow">
  <link rel="author" href="https://www.costumary.com">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebPage",
        "name": "{{ site.title }}",
        "description": "{{ site.description }}",
        "url": "{{ page.url | absolute_url }}",
        "inLanguage": "en-US",
        "dateModified": "2026-05-25",
        "publisher": {
          "@type": "Organization",
          "name": "Costumary",
          "url": "https://www.costumary.com",
          "sameAs": [
            "https://github.com/Costumary",
            "https://www.costumary.com"
          ]
        },
        "mainEntity": {
          "@type": "ItemList",
          "name": "Cosplay Building Resources",
          "description": "Curated materials, suppliers, tools, techniques, and planning resources for cosplay builders",
          "itemListOrder": "https://schema.org/ItemListUnordered",
          "numberOfItems": 200
        },
        "isPartOf": {
          "@type": "WebSite",
          "name": "Costumary",
          "url": "https://www.costumary.com"
        }
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What materials do I need for my first cosplay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "EVA foam sheets (6mm for armor panels, 2mm for details), contact cement (Barge or DAP Weldwood), a craft knife, FlexBond primer, and acrylic paint. Total starter materials cost: $30-60. Harbor Freight anti-fatigue mats work as budget foam."
            }
          },
          {
            "@type": "Question",
            "name": "How much does a cosplay cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Closet cosplay: $0-30. Simple sewn costume: $50-120. EVA foam armor set: $80-200. Full sewn and armor build: $150-400. Competition-grade: $300-800+. Hidden costs (paint, primer, adhesives, shipping) add $50-100."
            }
          },
          {
            "@type": "Question",
            "name": "What tools do I need for cosplay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A starter kit ($50-80) covers most first builds: craft knife with snap-off blades, self-healing cutting mat (18x24 inches), heat gun (Wagner HT1000), contact cement, sandpaper (120 and 220 grit), and FlexBond primer."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a respirator for cosplay building?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, for contact cement, spray paint, and resin work. A 3M 6200 half-face respirator ($15-25) with OV/P100 combo cartridges ($37/pair) covers all common cosplay chemicals. Brush-on acrylic paint and FlexBond only need an open window."
            }
          },
          {
            "@type": "Question",
            "name": "Where do cosplayers buy materials?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TNT Cosplay Supply and SKS Props for cosplay-grade foam. Harbor Freight and Home Depot for budget foam and tools. Mood Fabrics and JOANN for fabric. Arda Wigs and Epic Cosplay for wigs. Adafruit for LEDs and electronics."
            }
          }
        ]
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #F6F1EA;
      --surface: #FBF8F2;
      --warm: #EFE6DC;
      --ink: #23201E;
      --muted: #5E5650;
      --border: #D8CCC1;
      --rose: #B65F72;
      --rose-deep: #A24E62;
      --taupe: #8D8178;
      --charcoal: #171614;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.65;
    }

    /* --- Header --- */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
    }

    .site-header img {
      max-width: 100%;
      height: auto;
    }

    .site-header h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 2.4rem;
      color: var(--charcoal);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .site-header p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 520px;
      margin: 0 auto;
    }

    /* --- Main content --- */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Hide the first h1 + intro from README since the site header covers it */
    .content > h1:first-child,
    .content > h1:first-child + blockquote,
    .content > h1:first-child + blockquote + p,
    .content > h1:first-child + blockquote + p + hr {
      display: none;
    }

    /* --- Headings --- */
    h1, h2, h3, h4 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--charcoal);
      letter-spacing: -0.01em;
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin: 3rem 0 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 2rem 0 0.8rem;
      color: var(--ink);
    }

    h4 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 1.5rem 0 0.6rem;
    }

    /* --- Body text --- */
    p {
      margin: 0.8rem 0;
      color: var(--ink);
    }

    strong { font-weight: 600; }

    /* --- Links --- */
    a {
      color: var(--rose);
      text-decoration: none;
      transition: color 0.15s;
    }

    a:hover {
      color: var(--rose-deep);
      text-decoration: underline;
    }

    /* --- Lists --- */
    ul, ol {
      padding-left: 1.4rem;
      margin: 0.6rem 0;
    }

    li {
      margin: 0.4rem 0;
      line-height: 1.6;
    }

    li > ul, li > ol {
      margin: 0.2rem 0;
    }

    /* Task list items */
    li input[type="checkbox"] {
      margin-right: 0.4rem;
      accent-color: var(--rose);
    }

    /* --- Blockquotes --- */
    blockquote {
      border-left: 3px solid var(--rose);
      background: var(--surface);
      padding: 1rem 1.25rem;
      margin: 1.2rem 0;
      border-radius: 0 8px 8px 0;
      color: var(--muted);
      font-style: italic;
    }

    blockquote p { color: var(--muted); margin: 0; }

    /* --- Tables --- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 0.9rem;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }

    thead {
      background: var(--warm);
    }

    th {
      font-weight: 600;
      text-align: left;
      padding: 0.7rem 0.9rem;
      color: var(--charcoal);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    td {
      padding: 0.6rem 0.9rem;
      border-top: 1px solid var(--border);
      vertical-align: top;
    }

    tr:hover td {
      background: rgba(182, 95, 114, 0.04);
    }

    /* --- Code --- */
    code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: var(--warm);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.88em;
      color: var(--rose-deep);
    }

    pre {
      background: var(--charcoal);
      color: var(--paper);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    /* --- Horizontal rules --- */
    hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 3rem 0;
    }

    /* --- Images --- */
    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    /* Badges inline */
    h1 img, p > a > img {
      vertical-align: middle;
      border-radius: 2px;
    }

    /* --- Table of contents (Contents section) --- */
    .content > ul:first-of-type {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.5rem 1.2rem 2.5rem;
      margin: 1.5rem 0 2rem;
    }

    .content > ul:first-of-type li {
      margin: 0.25rem 0;
    }

    .content > ul:first-of-type a {
      font-weight: 500;
    }

    /* --- Sub footer --- */
    .content > sub:last-child,
    .content > p:last-child sub {
      display: block;
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--taupe);
    }

    /* --- Back to top --- */
    .back-to-top {
      display: block;
      text-align: center;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--taupe);
    }

    .back-to-top:hover { color: var(--rose); }

    /* --- Responsive --- */
    @media (max-width: 640px) {
      .site-header { padding: 1.5rem 1rem; }
      .site-header h1 { font-size: 1.8rem; }
      .content { padding: 1.5rem 1rem 3rem; }
      h2 { font-size: 1.5rem; }
      h3 { font-size: 1.15rem; }

      table { font-size: 0.82rem; }
      th, td { padding: 0.5rem 0.6rem; }

      /* Stack tables on very small screens */
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead { display: none; }

      tr {
        margin-bottom: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      td {
        padding: 0.5rem 0.75rem;
        text-align: left;
        border-top: none;
        border-bottom: 1px solid var(--border);
      }

      td:last-child { border-bottom: none; }

      td::before {
        content: attr(data-label);
        font-weight: 600;
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--taupe);
        margin-bottom: 0.15rem;
      }
    }

    @media (min-width: 1200px) {
      .content { max-width: 920px; }
    }

    /* --- Floating sidebar --- */
    .sidebar {
      position: fixed;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      z-index: 50;
    }

    .sidebar a, .sidebar button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--taupe);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      font-size: 0;
    }

    .sidebar a:hover, .sidebar button:hover {
      background: var(--warm);
      color: var(--rose);
      border-color: var(--rose);
      text-decoration: none;
    }

    .sidebar svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar .sidebar-label {
      position: absolute;
      left: 46px;
      background: var(--charcoal);
      color: var(--paper);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .sidebar a:hover .sidebar-label,
    .sidebar button:hover .sidebar-label {
      opacity: 1;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--charcoal);
      color: var(--paper);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* --- Tool logo images in tables --- */
    .tool-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
      border-radius: 4px;
    }

    @media (max-width: 900px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <nav class="sidebar" aria-label="Quick actions">
    <a href="https://github.com/Costumary/awesome-cosplay-building" target="_blank" rel="noopener" aria-label="View on GitHub">
      <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
      <span class="sidebar-label">View on GitHub</span>
    </a>
    <button onclick="copyLink()" aria-label="Copy link">
      <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      <span class="sidebar-label">Copy link</span>
    </button>
    <button onclick="printPage()" aria-label="Print page">
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      <span class="sidebar-label">Print / Save PDF</span>
    </button>
    <a href="#" aria-label="Back to top">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
      <span class="sidebar-label">Back to top</span>
    </a>
  </nav>

  <header class="site-header">
    <img src="{{ '/assets/armor-assembly.svg' | relative_url }}" alt="" width="680" style="display:block;margin:0 auto 1.5rem;">
    <h1>Awesome Cosplay Building</h1>
    <p>A curated list of materials, suppliers, tools, techniques, and planning resources for cosplay builders. Real products, real prices, real opinions.</p>
  </header>

  <main class="content">
    {{ content }}
    <a href="#" class="back-to-top">&uarr; Back to top</a>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(function() {
        showToast('Link copied');
      });
    }

    function printPage() {
      window.print();
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }
  </script>
</body>
</html>
