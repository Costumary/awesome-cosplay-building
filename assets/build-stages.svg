<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" width="740" height="160">
  <style>
    @keyframes highlight-travel {
      0%, 8%   { transform: translate(82px, 58px); opacity: 0.9; }
      15%      { transform: translate(82px, 58px); opacity: 0; }
      17%      { transform: translate(222px, 58px); opacity: 0; }
      20%, 28% { transform: translate(222px, 58px); opacity: 0.9; }
      35%      { transform: translate(222px, 58px); opacity: 0; }
      37%      { transform: translate(362px, 58px); opacity: 0; }
      40%, 48% { transform: translate(362px, 58px); opacity: 0.9; }
      55%      { transform: translate(362px, 58px); opacity: 0; }
      57%      { transform: translate(502px, 58px); opacity: 0; }
      60%, 68% { transform: translate(502px, 58px); opacity: 0.9; }
      75%      { transform: translate(502px, 58px); opacity: 0; }
      77%      { transform: translate(642px, 58px); opacity: 0; }
      80%, 92% { transform: translate(642px, 58px); opacity: 0.9; }
      100%     { transform: translate(642px, 58px); opacity: 0; }
    }
    @keyframes arrow-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes stage-fade-in {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes card-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .card-bg { fill: #1E1C1A; }
    .card-border { fill: none; stroke: #3A3632; stroke-width: 1; }
    .card-group { opacity: 0; animation: card-in 0.5s ease-out forwards; }

    .highlight-ring { animation: highlight-travel 10s ease-in-out infinite; }
    .arrow { animation: arrow-pulse 3s ease-in-out infinite; }

    .stage-1 { animation: stage-fade-in 0.5s ease-out 0.2s both; }
    .stage-2 { animation: stage-fade-in 0.5s ease-out 0.35s both; }
    .stage-3 { animation: stage-fade-in 0.5s ease-out 0.5s both; }
    .stage-4 { animation: stage-fade-in 0.5s ease-out 0.65s both; }
    .stage-5 { animation: stage-fade-in 0.5s ease-out 0.8s both; }

    .foam-fill { fill: #6E665E; }
    .sealed-fill { fill: #8A827A; }
    .primed-fill { fill: #C8BEB2; }
    .painted-fill { fill: #B65F72; }
    .weathered-fill { fill: #A24E62; }

    .shape-stroke { stroke: #B0A79E; stroke-width: 1.2; fill: none; stroke-linejoin: round; }
    .scratch { stroke: #3A2028; stroke-width: 1.2; stroke-linecap: round; opacity: 0.7; }
    .scratch-light { stroke: #D4899A; stroke-width: 0.7; stroke-linecap: round; opacity: 0.5; }
    .foam-texture { fill: #5A5248; opacity: 0.5; }

    .label-text { font-family: sans-serif; font-size: 10px; fill: #8D8178; text-anchor: middle; letter-spacing: 0.5px; }
    .title-text { font-family: sans-serif; font-size: 9px; fill: #5E5650; text-anchor: middle; letter-spacing: 3px; text-transform: uppercase; }
    .arrow-shape { fill: #5E5650; }
    .ring-stroke { fill: none; stroke: #B65F72; stroke-width: 2.5; filter: url(#ring-glow); }

    @media (prefers-color-scheme: light) {
      .card-bg { fill: #23201E; }
      .card-border { stroke: #3A3632; }
      .shape-stroke { stroke: #9A928A; }
      .label-text { fill: #A09890; }
      .title-text { fill: #6E665E; }
    }
  </style>

  <defs>
    <filter id="ring-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <path id="pauldron" d="
      M -30 -3
      Q -24 -26, 0 -32
      L 28 -26
      L 34 -8
      Q 34 16, 22 26
      L 0 32
      L -22 20
      Q -34 8, -30 -3
      Z
    "/>
  </defs>

  <!-- Dark card background -->
  <g class="card-group">
    <rect class="card-bg" x="10" y="6" width="720" height="148" rx="14"/>
    <rect class="card-border" x="10" y="6" width="720" height="148" rx="14"/>
  </g>

  <!-- Title -->
  <text class="title-text" x="370" y="28">Build pipeline</text>

  <!-- Traveling highlight ring -->
  <ellipse class="highlight-ring ring-stroke" cx="0" cy="0" rx="40" ry="40"/>

  <!-- Stage 1: Raw Foam -->
  <g class="stage-1" transform="translate(82, 58)">
    <use href="#pauldron" class="foam-fill"/>
    <circle class="foam-texture" cx="-10" cy="-8" r="2"/>
    <circle class="foam-texture" cx="7" cy="5" r="1.5"/>
    <circle class="foam-texture" cx="-4" cy="14" r="1.2"/>
    <circle class="foam-texture" cx="16" cy="-14" r="1.6"/>
    <circle class="foam-texture" cx="-16" cy="6" r="1.1"/>
    <circle class="foam-texture" cx="4" cy="-18" r="1.3"/>
    <use href="#pauldron" class="shape-stroke"/>
    <text class="label-text" x="0" y="50">Raw foam</text>
  </g>

  <!-- Arrow 1 -->
  <g class="arrow" transform="translate(130, 56)">
    <polygon class="arrow-shape" points="0,0 22,0 28,4 22,8 0,8"/>
  </g>

  <!-- Stage 2: Sealed -->
  <g class="stage-2" transform="translate(222, 58)">
    <use href="#pauldron" class="sealed-fill"/>
    <use href="#pauldron" class="shape-stroke"/>
    <text class="label-text" x="0" y="50">Sealed</text>
  </g>

  <!-- Arrow 2 -->
  <g class="arrow" transform="translate(270, 56)" style="animation-delay: 0.5s">
    <polygon class="arrow-shape" points="0,0 22,0 28,4 22,8 0,8"/>
  </g>

  <!-- Stage 3: Primed -->
  <g class="stage-3" transform="translate(362, 58)">
    <use href="#pauldron" class="primed-fill"/>
    <use href="#pauldron" class="shape-stroke"/>
    <text class="label-text" x="0" y="50">Primed</text>
  </g>

  <!-- Arrow 3 -->
  <g class="arrow" transform="translate(410, 56)" style="animation-delay: 1s">
    <polygon class="arrow-shape" points="0,0 22,0 28,4 22,8 0,8"/>
  </g>

  <!-- Stage 4: Painted -->
  <g class="stage-4" transform="translate(502, 58)">
    <use href="#pauldron" class="painted-fill"/>
    <use href="#pauldron" class="shape-stroke"/>
    <text class="label-text" x="0" y="50">Painted</text>
  </g>

  <!-- Arrow 4 -->
  <g class="arrow" transform="translate(550, 56)" style="animation-delay: 1.5s">
    <polygon class="arrow-shape" points="0,0 22,0 28,4 22,8 0,8"/>
  </g>

  <!-- Stage 5: Weathered -->
  <g class="stage-5" transform="translate(642, 58)">
    <use href="#pauldron" class="weathered-fill"/>
    <line class="scratch" x1="-14" y1="-16" x2="-5" y2="-5"/>
    <line class="scratch" x1="8" y1="-10" x2="18" y2="3"/>
    <line class="scratch" x1="-8" y1="5" x2="3" y2="18"/>
    <line class="scratch" x1="14" y1="8" x2="20" y2="18"/>
    <line class="scratch-light" x1="-13" y1="-15" x2="-4" y2="-4"/>
    <line class="scratch-light" x1="9" y1="-9" x2="19" y2="4"/>
    <path d="M -28 0 Q -22 -22, 2 -28" stroke="#D4899A" stroke-width="0.9" fill="none" opacity="0.35"/>
    <path d="M 30 -6 Q 30 14, 20 24" stroke="#D4899A" stroke-width="0.9" fill="none" opacity="0.3"/>
    <use href="#pauldron" class="shape-stroke"/>
    <text class="label-text" x="0" y="50">Weathered</text>
  </g>
</svg>
